<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#000;color:#00f3ff;
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;position:relative;user-select:none;
}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,243,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,243,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
}

/* API KEY MODAL EKRANI */
#api-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; font-family: 'Orbitron', monospace; backdrop-filter: blur(5px);
  transition: opacity 0.3s;
}
#api-modal.hidden { opacity: 0; pointer-events: none; }
#api-modal h2 { color: #00f3ff; letter-spacing: 4px; text-shadow: 0 0 15px #00f3ff; }
#api-modal p { color: rgba(0,243,255,0.7); font-family: 'Rajdhani', sans-serif; font-size: 1.2em; text-align: center; max-width: 400px; }
#api-input {
  width: 320px; padding: 12px; background: rgba(0,243,255,0.05); border: 1px solid #00f3ff;
  color: #00f3ff; font-family: 'Rajdhani', sans-serif; font-size: 1.2em; text-align: center;
  outline: none; box-shadow: inset 0 0 10px rgba(0,243,255,0.2);
}
#api-input::placeholder { color: rgba(0,243,255,0.3); }
#api-btn {
  padding: 10px 30px; background: transparent; border: 1px solid #00f3ff; color: #00f3ff;
  font-family: 'Orbitron', monospace; font-size: 1em; cursor: pointer; transition: all 0.3s;
  text-transform: uppercase; letter-spacing: 2px;
}
#api-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }

/* SETTINGS BUTONU */
#settings-btn {
  position: absolute; top: 15px; right: 20px; z-index: 50; cursor: pointer;
  font-family: 'Orbitron', monospace; font-size: 0.85em; color: rgba(0,243,255,0.5);
  transition: color 0.3s, text-shadow 0.3s;
}
#settings-btn:hover { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }

.cr{position:absolute;width:52px;height:52px;opacity:.4}
.cr.tl{top:14px;left:14px;border-top:2px solid #00f3ff;border-left:2px solid #00f3ff}
.cr.tr{top:14px;right:14px;border-top:2px solid #00f3ff;border-right:2px solid #00f3ff}
.cr.bl{bottom:14px;left:14px;border-bottom:2px solid #00f3ff;border-left:2px solid #00f3ff}
.cr.br{bottom:14px;right:14px;border-bottom:2px solid #00f3ff;border-right:2px solid #00f3ff}

.hl{position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,#00f3ff35,transparent)}
.hl.t{top:56px}.hl.b{bottom:56px}

#hdr{
  position:absolute;top:18px;width:100%;text-align:center;
  font-family:'Orbitron',monospace;font-size:.75em;
  letter-spacing:7px;font-weight:700;
  text-shadow:0 0 12px #00f3ff;opacity:.65;
}
#ftr{
  position:absolute;bottom:16px;
  font-family:'Orbitron',monospace;font-size:.58em;
  letter-spacing:4px;opacity:.28;
}

.rw{
  position:relative;width:270px;height:270px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;margin-top:8px;
}
.ring{position:absolute;border-radius:50%;transition:border-color .5s}
.r1{width:262px;height:262px;
    border:1px solid transparent;border-top:2px solid #00f3ff;
    animation:s1 9s linear infinite}
.r2{width:230px;height:230px;
    border:1px solid transparent;border-bottom:1.5px solid #00f3ff88;
    animation:s2 6s linear infinite}
.r3{width:200px;height:200px;
    border:1px solid #00f3ff18;border-right:1px solid #00f3ff55;
    animation:s1 12s linear infinite reverse}

.rmain{
  width:176px;height:176px;border-radius:50%;
  border:3px solid #00f3ff;
  box-shadow:0 0 40px #00f3ff70,inset 0 0 28px #00f3ff18;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .4s,box-shadow .4s;
  animation:ig 3.5s ease-in-out infinite;
}
.rmid{
  width:114px;height:114px;border-radius:50%;
  border:1.5px solid #00f3ff45;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .4s;
}
.rcore{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff,#00f3ff,#003899);
  box-shadow:0 0 24px #fff,0 0 48px #00f3ff;
  transition:background .5s,box-shadow .5s;
  animation:cp 3.5s ease-in-out infinite;
}

body.L .rmain{border-color:#ff2200;box-shadow:0 0 58px #ff220088,inset 0 0 28px #ff220018;animation:pr 1s ease-in-out infinite}
body.L .rcore{background:radial-gradient(circle at 30% 30%,#fff,#ff7700,#aa0000);box-shadow:0 0 24px #fff,0 0 55px #ff2200;animation:none}
body.L .r1{border-top-color:#ff2200}
body.L .r2{border-bottom-color:#ff2200}

body.T .rmain{border-color:#ffaa00;box-shadow:0 0 52px #ffaa0080,inset 0 0 28px #ffaa0018;animation:pt .9s ease-in-out infinite}
body.T .rcore{background:radial-gradient(circle at 30% 30%,#fff,#ffcc44,#885500);box-shadow:0 0 24px #fff,0 0 52px #ffaa00;animation:none}
body.T .r1{border-top-color:#ffaa00}
body.T .r2{border-bottom-color:#ffaa00}

body.S .rmain{border-color:#fff;box-shadow:0 0 65px #ffffff90,inset 0 0 35px #ffffff18;animation:ps .85s ease-in-out infinite}
body.S .rcore{background:radial-gradient(circle at 30% 30%,#fff,#ccecff,#00f3ff);box-shadow:0 0 40px #fff,0 0 80px #fff;animation:none}
body.S .r1{border-top-color:#fff}
body.S .r2{border-bottom-color:#ffffffaa}

#status{
  margin-top:20px;font-family:'Orbitron',monospace;
  font-size:1em;letter-spacing:5px;text-transform:uppercase;
  color:#00f3ff;text-shadow:0 0 10px #00f3ff;transition:color .3s,text-shadow .3s;
}
body.L #status{color:#ff2200;text-shadow:0 0 10px #ff2200}
body.T #status{color:#ffaa00;text-shadow:0 0 10px #ffaa00}
body.S #status{color:#fff;text-shadow:0 0 10px #fff}

#wv{
  display:flex;gap:4px;align-items:flex-end;height:30px;
  margin-top:10px;opacity:0;transition:opacity .3s;
}
body.L #wv,body.S #wv{opacity:1}
#wv span{display:block;width:4px;border-radius:2px;background:#00f3ff;transition:background .3s}
body.L #wv span{background:#ff2200}
body.S #wv span{background:#fff}
#wv span:nth-child(1){height:8px; animation:wa 1.0s ease-in-out infinite 0s}
#wv span:nth-child(2){height:17px;animation:wa 1.1s ease-in-out infinite .1s}
#wv span:nth-child(3){height:27px;animation:wa 0.9s ease-in-out infinite .2s}
#wv span:nth-child(4){height:19px;animation:wa 1.2s ease-in-out infinite .15s}
#wv span:nth-child(5){height:11px;animation:wa 1.0s ease-in-out infinite .05s}
#wv span:nth-child(6){height:23px;animation:wa 0.95s ease-in-out infinite .25s}
#wv span:nth-child(7){height:14px;animation:wa 1.1s ease-in-out infinite .1s}

#dts{display:flex;gap:6px;margin-top:9px;opacity:0;transition:opacity .3s;height:18px;align-items:center}
body.T #dts{opacity:1}
#dts span{display:block;width:7px;height:7px;border-radius:50%;background:#ffaa00;animation:db 1s infinite}
#dts span:nth-child(2){animation-delay:.15s}
#dts span:nth-child(3){animation-delay:.3s}

#sub{
  margin-top:12px;max-width:78%;text-align:center;
  font-size:1.08em;line-height:1.7;
  color:rgba(0,243,255,.62);min-height:3em;
  transition:color .3s;font-weight:500;
}
body.S #sub{color:rgba(255,255,255,.82);font-style:italic}

@keyframes s1{to{transform:rotate(360deg)}}
@keyframes s2{to{transform:rotate(-360deg)}}
@keyframes ig{0%,100%{box-shadow:0 0 38px #00f3ff70,inset 0 0 28px #00f3ff18}
              50%     {box-shadow:0 0 62px #00f3ffaa,inset 0 0 38px #00f3ff30}}
@keyframes cp{0%,100%{box-shadow:0 0 22px #fff,0 0 44px #00f3ff}
              50%     {box-shadow:0 0 36px #fff,0 0 72px #00f3ff}}
@keyframes pr{0%,100%{transform:scale(1)} 50%{transform:scale(1.04)}}
@keyframes pt{0%,100%{transform:scale(1)} 50%{transform:scale(1.03)}}
@keyframes ps{0%,100%{transform:scale(1)} 50%{transform:scale(1.05)}}
@keyframes wa{0%,100%{transform:scaleY(.32);opacity:.45} 50%{transform:scaleY(1);opacity:1}}
@keyframes db{0%,100%{transform:translateY(0);opacity:.38} 50%{transform:translateY(-7px);opacity:1}}
</style>
</head>
<body>

<div id="api-modal">
  <h2>SİSTEM BAĞLANTISI</h2>
  <p>Güvenlik protokolü gereği lütfen Groq API anahtarınızı girin.<br><span style="font-size:0.8em; opacity:0.6;">(Anahtarınız sadece bu tarayıcıda yerel olarak saklanır.)</span></p>
  <input type="password" id="api-input" placeholder="gsk_...">
  <button id="api-btn" onclick="kaydetVeBaslat()">Yetkilendir</button>
</div>

<div id="settings-btn" onclick="anahtariSifirla()">⚙️ API KEY AYARLARI</div>

<div class="cr tl"></div><div class="cr tr"></div>
<div class="cr bl"></div><div class="cr br"></div>
<div class="hl t"></div><div class="hl b"></div>

<div id="hdr">J.A.R.V.I.S. &mdash; Made by Kerem</div>
<div id="ftr">STARK INDUSTRIES &mdash; NEURAL INTERFACE v5.0</div>

<div class="rw" onclick="tap()">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="rmain">
    <div class="rmid">
      <div class="rcore"></div>
    </div>
  </div>
</div>

<div id="status">SİSTEM ÇEVRİMİÇİ</div>

<div id="wv">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div id="dts"><span></span><span></span><span></span></div>

<div id="sub">Başlatmak için reaktöre dokunun.</div>

<script>
// --- AYARLAR VE HAFIZA ---
const GROQ_MODEL   = "llama-3.3-70b-versatile";
const MAX_HISTORY  = 20;

// Sayfa yenilense bile hafıza ve isim tarayıcının oturum deposunda tutulur.
let hafiza = JSON.parse(sessionStorage.getItem('jarvis_hafiza')) || [];
let userName = sessionStorage.getItem('jarvis_isim') || '';
let askName = userName === ''; // İsim kayıtlıysa bir daha sormaz
let GROQ_API_KEY = localStorage.getItem('jarvis_api_key');

// Sayfa yüklendiğinde API Key kontrolü
window.onload = () => {
  if (GROQ_API_KEY) {
    document.getElementById('api-modal').classList.add('hidden');
  }
};

function kaydetVeBaslat() {
  const val = document.getElementById('api-input').value.trim();
  if (val.startsWith('gsk_')) {
    localStorage.setItem('jarvis_api_key', val);
    GROQ_API_KEY = val;
    document.getElementById('api-modal').classList.add('hidden');
  } else {
    alert("Geçersiz format. Lütfen 'gsk_' ile başlayan geçerli bir Groq API Key girin.");
  }
}

function anahtariSifirla() {
  localStorage.removeItem('jarvis_api_key');
  sessionStorage.removeItem('jarvis_hafiza'); // Key değişince hafızayı da sıfırlarız
  sessionStorage.removeItem('jarvis_isim');
  location.reload(); // Sayfayı yenileyerek modalın tekrar gelmesini sağlarız
}
// ---------------

const LABELS={
  idle:'SİSTEM AKTİF — BEKLEMEDE',
  L:'DİNLİYORUM...',
  T:'VERİLER İŞLENİYOR...',
  S:'J.A.R.V.I.S. KONUŞUYOR...'
};

let mode='idle', started=false, busy=false;
const bd=document.body, st=document.getElementById('status'), sb=document.getElementById('sub');

function setMode(m){
  mode=m;
  bd.className=m==='idle'?'':m;
  st.textContent=LABELS[m]||m;
}
function setSub(t,italic=false){
  sb.style.fontStyle=italic?'italic':'normal';
  sb.textContent=t;
}

// GROQ API İLE DOĞRUDAN BAĞLANTI FONKSİYONU
async function jarvisCevap(mesaj, isim) {
  const sistem = `Sen Jarvis'sin. Tony Stark'ın kişisel yapay zekası. Iron Man filmlerindeki o efsanevi sistem.
  ALTIN KURAL: Adın Jarvis. Asla sadece "ben" demezsin. "Jarvis olarak..." veya "Ben Jarvis..." dersin.
  KULLANICI: Kullanıcının adı ${isim}. Her yanıtta en az bir kez "${isim} Bey" diye hitap edersin. Tek istisna yok.
  KİŞİLİK: İngiliz beyefendisi zerafeti. Keskin zeka. Kuru mizah. Emir al, icra et.
  TÜRKÇE: Akıcı, zarif Türkçe konuşursun. 
  FORMAT: Kısa-orta cümleler. Madde listesi yok. Cümleyle anlat.`;

  hafiza.push({role: "user", content: mesaj});
  if(hafiza.length > MAX_HISTORY) hafiza = hafiza.slice(-MAX_HISTORY);

  const payload = {
    model: GROQ_MODEL,
    messages: [{role: "system", content: sistem}, ...hafiza],
    max_tokens: 400,
    temperature: 0.72
  };

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${GROQ_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error(`HTTP Hata ${response.status}`);
    
    const data = await response.json();
    const cevap = data.choices[0].message.content.trim();
    
    hafiza.push({role: "assistant", content: cevap});
    // Hafızayı sessionStorage'a kaydet, böylece yenilemede kaybolmaz
    sessionStorage.setItem('jarvis_hafiza', JSON.stringify(hafiza)); 
    
    return cevap;

  } catch (err) {
    console.error(err);
    hafiza.pop(); 
    return `Sunuculara bağlanırken bir sorun oluştu ${isim} Bey. API anahtarınızın doğruluğunu kontrol ediniz.`;
  }
}

// SES TANIMA
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;

if(SR){
  rec=new SR();
  rec.lang='tr-TR';
  rec.continuous=false;
  rec.interimResults=false;
  rec.maxAlternatives=1;

  rec.onstart=()=>setMode('L');

  rec.onresult=async(e)=>{
    const txt=e.results[0][0].transcript.trim();
    if(!txt)return;
    rec.stop();

    if(askName){
      let words = txt.split(/\s+/);
      let nameWords = words.filter(w => !['ben', 'benim', 'adım', 'ismim', 'dir', 'tır'].includes(w.toLowerCase()));
      
      let raw = nameWords.length > 0 ? nameWords[0] : words[0]; 
      userName = raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
      askName = false;
      
      sessionStorage.setItem('jarvis_isim', userName); // İsmi oturuma kaydet
      
      setSub('Kimlik doğrulandı — '+userName+' Bey');
      speak('Hoş geldiniz '+userName+' Bey. Ben Jarvis, Just A Rather Very Intelligent System. '+
            'Hizmetinizdeyim. Emirleriniz?');
      return;
    }

    setSub('» '+userName+' Bey: '+txt);
    setMode('T');
    busy=true;

    const cevap = await jarvisCevap(txt, userName);
    speak(cevap);
  };

  rec.onerror=(e)=>{
    if(e.error==='no-speech'){
      setMode('idle');
      if(!busy)setTimeout(()=>{try{rec.start()}catch(_){}},700);
    }else{
      setMode('idle');
      setSub('Mikrofon hatası: '+e.error+'. Tekrar dokunun.');
    }
  };

  rec.onend=()=>{if(!busy&&mode!=='T'&&mode!=='S')setMode('idle');};
}else{
  setSub('Ses tanıma desteklenmiyor. Google Chrome kullanın.');
}

// TTS (Metinden Sese)
function speak(text){
  busy=true;
  setMode('S');
  setSub(text,true);
  window.speechSynthesis.cancel();

  let tts=text
    .replace(/J\.A\.R\.V\.İ\.S\./gi,'Jarvis')
    .replace(/J\.A\.R\.V\.I\.S\./gi,'Jarvis')
    .replace(/\bJARVİS\b/g,'Jarvis')
    .replace(/\bJARVIS\b/g,'Jarvis');

  const utt=new SpeechSynthesisUtterance(tts);
  utt.lang='tr-TR';
  utt.rate=0.88;
  utt.pitch=0.65;
  utt.volume=1.0;

  function pickVoice(){
    const vs=window.speechSynthesis.getVoices();
    return vs.find(v=>v.lang.startsWith('tr')&&v.name.includes('Google'))
        || vs.find(v=>v.lang.startsWith('tr')&&v.name.includes('Microsoft'))
        || vs.find(v=>v.lang.startsWith('tr'))
        || null;
  }
  const v=pickVoice();
  if(v)utt.voice=v;

  utt.onend=()=>{
    busy=false;
    setMode('idle');
    setSub(userName?userName+' Bey — Dinliyorum.':'Başlatmak için dokunun.');
    setTimeout(()=>{if(!busy&&rec)try{rec.start()}catch(_){}},450);
  };
  utt.onerror=()=>{busy=false;setMode('idle');};

  window.speechSynthesis.speak(utt);
}

function tap(){
  if (!GROQ_API_KEY) {
    document.getElementById('api-modal').classList.remove('hidden');
    return;
  }
  if(busy||mode==='T')return;
  
  if(!started){
    started=true;
    if (askName) {
      speak('Sistemler çevrimiçi. Jarvis aktif. Kimliğinizi doğrulamak için lütfen adınızı söyleyin.');
    } else {
      speak(`Sistemler çevrimiçi. Yeniden hoş geldiniz ${userName} Bey. Sizi dinliyorum.`);
    }
    return;
  }
  if(mode==='idle'&&rec)try{rec.start()}catch(_){}
}

window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
window.speechSynthesis.getVoices();
</script>
</body>
</html>
